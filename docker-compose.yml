services:
  qdrant:
    image: qdrant/qdrant:v1.14.1  # aligned with qdrant-client 1.14.x (see pyproject)
    # Run as the host user so bind-mount files stay deletable without sudo
    # (isolation contract S2).
    user: "1000:1000"
    container_name: rag-hybrid-qdrant
    ports:
      - "6333:6333" # HTTP
      - "6334:6334" # gRPC
    volumes:
      # Everything stays inside the project folder: delete the repo (plus
      # `docker compose down -v` / `docker image rm`) and the machine is clean.
      - ./.qdrant_storage:/qdrant/storage
    environment:
      # Running as a non-root user cannot write the image's ./snapshots;
      # keep snapshots inside the bind-mounted storage dir.
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    restart: unless-stopped

  webapp:
    build: .
    container_name: rag-hybrid-webapp
    depends_on:
      - qdrant
    ports:
      # Host-side loopback only: the UI stays off the LAN.
      - "127.0.0.1:8000:8000"
    environment:
      # Service DNS inside the compose network (overrides the .env default).
      QDRANT_URL: http://qdrant:6333
    env_file:
      # OPENROUTER_API_KEY / DEEPSEEK_API_KEY / model knobs. Passed as real
      # env vars; never baked into the image (.dockerignore excludes .env).
      - .env
    restart: unless-stopped
