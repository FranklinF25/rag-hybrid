[project]
name = "rag-hybrid-evals"
version = "0.1.0"
description = "DeepEval harness for rag-hybrid (language-agnostic: talks to the HTTP API only)"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["pytest>=8"]
eval = ["deepeval>=2", "openai>=1.50"]

[tool.uv]
default-groups = ["dev", "eval"]

[tool.pytest.ini_options]
testpaths = ["evals"]
markers = [
    "eval: DeepEval RAG metrics (need the API running and DEEPSEEK_API_KEY)",
]
