<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-hybrid</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1c222d;
    --border: #2a3241;
    --text: #dbe2ee;
    --muted: #8a94a6;
    --accent: #7aa2f7;
    --user: #2b3a5c;
    --ok: #4cc38a;
    --bad: #f7768e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.3px; }
  header h1 span { color: var(--muted); font-weight: 400; }
  #health {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel-2);
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  #health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #health.up .dot { background: var(--ok); }
  #health.up { color: var(--text); }
  #health.down .dot { background: var(--bad); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 78%; display: flex; flex-direction: column; gap: 6px; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; }
  .msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; }
  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg .bubble.pending { color: var(--muted); font-style: italic; }
  .msg details { font-size: 13px; color: var(--muted); }
  .msg details summary { cursor: pointer; user-select: none; }
  .msg details summary:hover { color: var(--accent); }
  .msg details ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .msg details li { padding: 6px 8px; background: var(--panel-2); border-radius: 6px; }
  .msg details li .src { color: var(--text); font-weight: 600; }
  .msg details li .score { color: var(--accent); font-variant-numeric: tabular-nums; }
  .msg details li .prev { display: block; color: var(--muted); }

  #controls {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #askrow { display: flex; gap: 8px; }
  #message {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    outline: none;
  }
  #message:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #10151f;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #uploadrow { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  #upload { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 7px 14px; font-weight: 500; }
  #upload:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #uploadresult { overflow-wrap: anywhere; }
  footer { padding: 8px 18px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>rag-hybrid <span>&mdash; local hybrid RAG chat</span></h1>
  <div id="health" class="down"><span class="dot"></span><span id="healthlabel">checking&hellip;</span></div>
</header>

<main id="chat"></main>

<div id="controls">
  <div id="askrow">
    <input id="message" type="text" placeholder="Ask about your indexed documents&hellip;" autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </div>
  <div id="uploadrow">
    <input id="fileinput" type="file" multiple accept=".md,.txt,.rst" hidden>
    <button id="upload">Upload documents (.md / .txt / .rst)</button>
    <span id="uploadresult"></span>
  </div>
</div>

<footer>
  Upload .md / .txt / .rst files to index them, then ask questions.
  Chat answers need DEEPSEEK_API_KEY in your .env; Qdrant must be running.
</footer>

<script>
"use strict";
const $chat = document.getElementById("chat");
const $input = document.getElementById("message");
const $send = document.getElementById("send");
const $health = document.getElementById("health");
const $healthLabel = document.getElementById("healthlabel");
const $upload = document.getElementById("upload");
const $uploadResult = document.getElementById("uploadresult");
const $fileInput = document.getElementById("fileinput");
let busy = false;

function enableInput() {
  busy = false;
  $send.disabled = false;
  $input.disabled = false;
  $input.focus();
}

function addMessage(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble);
  $chat.appendChild(wrap);
  $chat.scrollTop = $chat.scrollHeight;
  return { wrap, bubble };
}

function addSources(wrap, sources) {
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = "Sources (" + sources.length + ")";
  details.appendChild(summary);
  const list = document.createElement("ul");
  for (const s of sources) {
    const item = document.createElement("li");
    const src = document.createElement("span");
    src.className = "src";
    src.textContent = s.source;
    const score = document.createElement("span");
    score.className = "score";
    score.textContent = s.score == null ? "" : "  " + Number(s.score).toFixed(3);
    const prev = document.createElement("span");
    prev.className = "prev";
    prev.textContent = s.preview;
    item.appendChild(src);
    item.appendChild(score);
    item.appendChild(prev);
    list.appendChild(item);
  }
  details.appendChild(list);
  wrap.appendChild(details);
  $chat.scrollTop = $chat.scrollHeight;
}

async function refreshHealth() {
  let label = "offline";
  let cls = "down";
  try {
    const res = await fetch("/api/health");
    const h = await res.json();
    if (h.qdrant) {
      label = h.points == null ? "Qdrant up \u00b7 0 points" : "Qdrant up \u00b7 " + h.points + " points";
      cls = "up";
    } else {
      label = "Qdrant down";
    }
    if (!h.key) label += " \u00b7 no API key";
  } catch (_) { /* keep defaults */ }
  $health.className = cls;
  $healthLabel.textContent = label;
}

async function sendMessage() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $send.disabled = true;
  $input.disabled = true;
  $input.value = "";
  addMessage("user", text);
  const pending = addMessage("assistant", "Thinking\u2026");
  pending.bubble.classList.add("pending");
  let sources = [];
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    pending.bubble.classList.remove("pending");
    if (!res.ok) {
      pending.bubble.textContent = "Error: " + (data.detail || res.status);
    } else {
      pending.bubble.textContent = data.answer || "(empty answer)";
      sources = data.sources || [];
    }
  } catch (err) {
    pending.bubble.classList.remove("pending");
    pending.bubble.textContent = "Error: request failed (" + err + ")";
  }
  if (sources.length) addSources(pending.wrap, sources);
  enableInput();
}

$send.addEventListener("click", sendMessage);
$input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
});

$upload.addEventListener("click", () => { if (!$upload.disabled) $fileInput.click(); });
$fileInput.addEventListener("change", async () => {
  const files = Array.from($fileInput.files || []);
  $fileInput.value = "";
  if (!files.length || busy) return;
  busy = true;
  $upload.disabled = true;
  $send.disabled = true;
  $input.disabled = true;
  $uploadResult.textContent = "Indexing\u2026 (" + files.length + " file" + (files.length > 1 ? "s" : "") + ")";
  const form = new FormData();
  for (const f of files) form.append("files", f);
  try {
    const res = await fetch("/api/documents", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) {
      $uploadResult.textContent = "Error: " + (data.detail || res.status);
    } else {
      let line = "Indexed " + data.files + " file" + (data.files > 1 ? "s" : "") +
        " \u2192 " + data.chunks + " chunk" + (data.chunks === 1 ? "" : "s") + ".";
      if (data.skipped && data.skipped.length) line += " Skipped: " + data.skipped.join("; ");
      $uploadResult.textContent = line;
    }
  } catch (err) {
    $uploadResult.textContent = "Error: upload failed (" + err + ")";
  }
  enableInput();
  $upload.disabled = false;
  refreshHealth();
});

refreshHealth();
enableInput();
</script>
</body>
</html>
